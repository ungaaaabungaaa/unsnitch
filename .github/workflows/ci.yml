name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: unsnitch-extension
          path: dist/*.zip
