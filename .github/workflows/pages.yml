# Publishes site/ (landing page + web cleaner PWA) to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'extension/core/clean.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Keep the site's cleaner identical to the extension's.
      - name: Sync clean.js
        run: |
          { echo '/* Synced from extension/core/clean.js — edit that file, not this one. */'; cat extension/core/clean.js; } > site/clean.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
