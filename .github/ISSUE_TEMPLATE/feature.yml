name: Feature request
description: Suggest an idea. Please keep it small, local-only and permission-light.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: Works without network requests, analytics or remote code
          required: true
        - label: I'd be willing to help implement it
