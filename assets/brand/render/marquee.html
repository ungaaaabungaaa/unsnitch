<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
.card{inset:0;border-radius:0;box-shadow:none}
.body{width:830px;padding:60px 64px 0;position:relative;flex:none}
.brand{font-size:30px;gap:14px}.brand img{width:44px;height:44px}

.url{position:absolute;left:64px;bottom:56px;font-size:14.5px}
.mosaic{flex:1;margin:24px 24px 24px 0;border-radius:var(--us-r-card);overflow:hidden;background-size:auto 100%;background-position:85% center}
.pill{left:20px;right:20px;top:20px;height:52px;padding:0 24px;font-size:16px}
.pill span{opacity:.65}
