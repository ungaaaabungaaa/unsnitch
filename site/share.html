<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Unsnitch — clean link</title>
  <meta name="theme-color" content="#F3F2EF">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="clean.js" defer></script>
  <script src="share.js" defer></script>
</head>
<body class="share-page">
  <main>
    <section class="card">
      <div class="mosaic share-mosaic">
        <header class="pill nav">
          <a class="brand" href="./" aria-label="Unsnitch home">
            <img src="img/logo-small.svg" alt="" width="28" height="28">
            <span class="wordmark">unsnitch</span>
          </a>
        </header>
      </div>

      <div class="card-body">
        <h1>Your clean link.</h1>
        <p id="status" class="share-status" role="status" aria-live="polite">Cleaning&hellip;</p>

        <div id="found">
          <output id="result" class="result"></output>
          <div class="share-actions">
            <button type="button" class="btn btn-primary" id="copy">Copy clean link</button>
            <button type="button" class="btn btn-ghost" id="share" hidden>Share clean link</button>
          </div>
          <p id="orig" class="share-orig"></p>
        </div>

        <div id="manual" hidden>
          <label for="in" class="label">Paste a link or text with an X link</label>
          <textarea id="in" rows="3" spellcheck="false" autocomplete="off" placeholder="https://x.com/someone/status/123?s=19"></textarea>
          <button type="button" class="btn btn-primary" id="clean-manual">Clean it</button>
        </div>

        <p class="share-back"><a href="./">What is Unsnitch?</a></p>
      </div>
    </section>
  </main>
</body>
</html>
